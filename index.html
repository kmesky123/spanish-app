  <!--
    THESIS: A study tool is not a toy — it is the board a serious learner works at, so the interface earns its keep as a real chalkboard rather than another rounded-bubbly gamified app shell.
    OWN-WORLD: Slate-green ground with chalk-dust texture; hand-chalked Kalam display type over precise Space Grotesk body/data; chalk-white/ochre/rust-red accent trio; wood-and-brass frame edges as structural dividers; chalk tally-marks and circle/X marks stand in for progress bars and color-fill quiz states.
    STORY: The learner opens the board mid-lesson, reads what's chalked up, works through it, and their marks (tallies, stamps, circles) accumulate on the same board across visits.
    FIRST VIEWPORT: Large hand-chalked "¡Bienvenido!" headline, a chalk-ledger progress line beneath it (not stat tiles), a numbered chalk step-flow replacing the generic three-card "how it works" grid, CTA rendered as chalk-outlined boxes.
    FORM: Direction 5 of 7 grounded candidates (transit signage, Leitner box, phrasebook, passport/stamps, CHALKBOARD, airmail, travel poster), seed key e370d7df, assigned index 5.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
  -->
